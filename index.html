
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Pixels | To-Do List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        
        <header class="header">

            <div class="header-top">
                <svg class="pixel-heart" viewBox="0 0 11 10"
                     shape-rendering="crispEdges" aria-hidden="true">
                    <path fill="#F28BB7"
                        d="M1 0h3v1h3v-1h3v1h1v3h-1v2h-2v2h-2v1h-1v-1h-2v-2h-2v-2h-1v-3h1z"/>
                    <path fill="#FFFFFF" d="M2 1h2v1H2zM2 2h1v2H2z"/>
                </svg>

                <span>PERSONAL PRODUCTIVITY</span>

                <svg class="pixel-star" viewBox="0 0 9 9"
                     shape-rendering="crispEdges" aria-hidden="true">
                    <path fill="#F0BD45"
                        d="M3 0h3v3h3v3H6v3H3V6H0V3h3z"/>
                </svg>
            </div>

            <h1>MY TO-DO LIST</h1>

            <p>A LITTLE PROGRESS EVERY DAY.</p>

            <div class="pixel-divider"></div>

        </header>


        
        <section class="summary">

            <div class="section-heading">
                <h2>TASK PROGRESS</h2>

                <span id="taskCount">0 / 0</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <p class="progress-caption">
                KEEP GOING. YOU'RE DOING GREAT!
            </p>

        </section>


        
        <section class="add-section">

            <h2>ADD A NEW TASK</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Write something to do..."
                    maxlength="100"
                    autocomplete="off"
                    required
                >

                <button type="submit" class="add-btn">
                    + ADD
                </button>

            </form>

        </section>


        
        <section class="filter-section">

            <button class="filter-btn active" data-filter="all">
                ALL
            </button>

            <button class="filter-btn" data-filter="active">
                ACTIVE
            </button>

            <button class="filter-btn" data-filter="completed">
                COMPLETED
            </button>

        </section>


        
        <section class="tasks-section">

            <div class="section-heading">
                <h2>YOUR TASKS</h2>

                <svg class="tiny-star" viewBox="0 0 9 9"
                     shape-rendering="crispEdges" aria-hidden="true">
                    <path fill="#39A83E"
                        d="M3 0h3v3h3v3H6v3H3V6H0V3h3z"/>
                </svg>
            </div>

            <ul id="taskList"></ul>

            <div id="emptyMessage" class="empty-message">

                <svg viewBox="0 0 16 16" width="48" height="48"
                     shape-rendering="crispEdges" aria-hidden="true">
                    <path fill="#D94F91"
                        d="M3 1h3v1h4v-1h3v2h1v3h-2v2h-2v2H8v2H6v-2H4V8H2V6H1V3h2z"/>
                    <path fill="#F28BB7" d="M3 3h2v2H3z"/>
                </svg>

                <p>NOTHING TO DO YET!</p>
                <span>ADD YOUR FIRST TASK ABOVE.</span>

            </div>

        </section>


        
        <footer class="footer">

            <div class="footer-decoration">
                ★ ♥ ★ ♥ ★
            </div>

            <p>SMALL STEPS MAKE BIG DIFFERENCES.</p>

            <span>MADE WITH PIXELS & LOVE</span>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
